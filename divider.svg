<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 20" width="100%" height="20">
  <style>
    @keyframes glow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes scan {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .base-line {
      stroke: #d97757;
      stroke-width: 1;
      stroke-linecap: round;
      opacity: 0.3;
    }
    .glow-line {
      stroke: #d97757;
      stroke-width: 2;
      stroke-linecap: round;
      animation: glow 3s ease-in-out infinite;
    }
  </style>
  <line x1="10" y1="10" x2="790" y2="10" class="base-line" />
  
  <mask id="scan-mask">
    <rect x="0" y="0" width="100" height="20" fill="white">
      <animate attributeName="x" values="-100;800" dur="4s" repeatCount="indefinite" />
    </rect>
  </mask>
  
  <line x1="10" y1="10" x2="790" y2="10" class="glow-line" mask="url(#scan-mask)" />
  
  <circle cx="10" cy="10" r="3" fill="#d97757" />
  <circle cx="790" cy="10" r="3" fill="#d97757" />
</svg>
