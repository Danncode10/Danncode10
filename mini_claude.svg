<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 13 9" width="35" height="35">
  <style>
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
    .bot { fill: #d97757; animation: bob 2s infinite; }
  </style>
  <g class="bot">
    <rect x="3" y="0" width="7" height="6" />
    <rect x="1" y="3" width="11" height="2" />
    <rect x="3" y="6" width="1" height="2" />
    <rect x="5" y="6" width="1" height="2" />
    <rect x="7" y="6" width="1" height="2" />
    <rect x="9" y="6" width="1" height="2" />
    <rect x="4" y="2" width="1" height="2" fill="#151515" />
    <rect x="8" y="2" width="1" height="2" fill="#151515" />
  </g>
</svg>
